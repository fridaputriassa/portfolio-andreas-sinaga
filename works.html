<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works · Andreas Hasiholan Sinaga</title>
<meta name="description" content="Papers, thesis, debrief, and assignments by Andreas Hasiholan Sinaga.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1a24;--panel:#162536;--panel2:#1d3045;--steel:#2c4254;--khaki:#c9a45c;--rust:#b8582e;--cream:#ece3cf;--ink:#e6e1d3;--muted:#8ea0b0;--moss:#6f8a55}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.6;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--khaki);text-decoration:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--khaki);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:5;background:rgba(15,26,36,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--steel)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.nav a{color:var(--muted);font-size:15px}
.nav a:hover{color:var(--ink)}
.nav .logo{color:var(--khaki);font-family:'JetBrains Mono',monospace;font-size:18px}
header{padding:70px 0 40px}
.kicker{color:var(--khaki);font-size:14px;margin-bottom:10px}
h1{font-size:clamp(34px,5vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:14px}
.lead{max-width:62ch;color:var(--muted);font-size:17px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:36px 0 26px}
.filters button{background:var(--panel);border:1px solid var(--steel);color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;transition:all .2s;font-family:'JetBrains Mono',monospace}
.filters button:hover{color:var(--ink)}
.filters button.on{background:var(--khaki);color:var(--navy);border-color:var(--khaki)}
.filters .count{opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:80px}
.item{background:var(--panel);border:1px solid var(--steel);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;animation:in .5s ease both}
.item:hover{transform:translateY(-4px);border-color:var(--khaki);box-shadow:0 18px 36px -20px rgba(201,164,92,.35)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.item .type{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--khaki);color:var(--khaki)}
.item.paper .type{background:var(--khaki);color:var(--navy)}
.item.skripsi .type{border-color:var(--moss);color:var(--moss)}
.item.debrief .type{border-color:var(--rust);color:#e0875b}
.item h3{font-size:18px;font-weight:700;line-height:1.3}
.item p{font-size:14.5px;color:var(--muted)}
.item .venue{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cream)}
.item .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--steel)}
.item .foot span{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.item .go{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--navy);background:var(--khaki);padding:8px 12px;border-radius:4px;white-space:nowrap;transition:transform .2s}
.item .go:hover{transform:translateX(3px)}
.item.draft{border-style:dashed}
.item .draft-badge{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.empty{display:none;color:var(--muted);padding:40px 0}
.empty.show{display:block}
footer{border-top:1px solid var(--steel);padding:30px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:560px){.item{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="logo" href="index.html">ash<span>_</span></a>
  <a href="index.html">← Portfolio</a>
</div></nav>

<header><div class="wrap">
  <p class="mono kicker">// works</p>
  <h1>Papers, thesis & assignments</h1>
  <p class="lead">Research papers, my bachelor thesis, the internship debrief, and course projects. Filter by type, then open the document.</p>
</div></header>

<main class="wrap">
  <div class="filters" id="filters" role="tablist"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Nothing in this category yet.</p>
</main>

<footer><div class="wrap">
  <span>© 2026 Andreas Hasiholan Sinaga</span>
  <a href="index.html">← Back to portfolio</a>
</div></footer>

<script>
/*
  ===== EDIT DI SINI =====
  type: "paper" | "skripsi" | "debrief" | "tugas"
  file: nama file di folder files/ (contoh: "files/skripsi.pdf"). Kosongkan "" kalau belum ada.
  draft: true kalau entri masih perlu diisi (akan diberi tanda "draft")
*/
const WORKS=[
  {type:'paper',title:'Bridging Accessibility Gaps: A Mobile Color Detection App with Real-Time Voice Support for Colour Vision Deficiency',venue:'IEEE · ICATEI 2025',date:'Mar 2026',desc:'Mobile color detection for people with color vision deficiency. Real-time color recognition, text-to-speech feedback, and a color history. 90–96% color accuracy and an 81.6% user satisfaction score.',file:'files/paper-color-detection.pdf'},
  {type:'paper',title:'Continuous Severity-Level Simulation of Color Vision Deficiency Using Interpolated LMS-RGB Transformation',venue:'IEEE · BTS-I2C 2025',date:'Feb 2026',desc:'A continuous CVD simulation based on Machado\'s LMS-RGB model, with smooth transitions across severity levels, evaluated with CIEDE2000.',file:'files/paper-cvd-simulation.pdf'},
  {type:'skripsi',title:'[Judul skripsi kamu]',venue:'Telkom University · Computer Engineering',date:'2025',desc:'[Tulis ringkasan singkat skripsi di sini: masalah, metode, dan hasil utama.]',file:'files/skripsi.pdf',draft:true},
  {type:'debrief',title:'ITFC Asset Management Internship: Final Debrief',venue:'MagangHub Batch 2 · Bank Danamon',date:'Nov 2025 – May 2026',desc:'Full debrief of my internship: warehouse stocktaking, JIRA tickets, asset delivery, stock opname, auction validation, and a digital stock card app.',link:'debrief.html'},
  {type:'tugas',title:'[Judul tugas: contoh Data Warehouse project]',venue:'Telkom University · [mata kuliah]',date:'[tahun]',desc:'[Tulis ringkasan singkat tugas ini: tujuan dan hal yang kamu kerjakan.]',file:'',draft:true}
];

/* ===== render ===== */
const TYPES=[['all','All'],['paper','Papers'],['skripsi','Thesis'],['debrief','Debrief'],['tugas','Assignments']];
const filtersEl=document.getElementById('filters');
const gridEl=document.getElementById('grid');
const emptyEl=document.getElementById('empty');
const LABEL={paper:'Paper',skripsi:'Skripsi',debrief:'Debrief',tugas:'Tugas'};

function count(t){return t==='all'?WORKS.length:WORKS.filter(w=>w.type===t).length}
function renderFilters(active){
  filtersEl.innerHTML=TYPES.map(([k,l])=>`<button role="tab" aria-selected="${k===active}" class="${k===active?'on':''}" data-t="${k}">${l}<span class="count">${count(k)}</span></button>`).join('');
  filtersEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.t)));
}
function render(active){
  renderFilters(active);
  const list=WORKS.filter(w=>active==='all'||w.type===active);
  gridEl.innerHTML=list.map((w,i)=>{
    const href=w.link||w.file||'';
    const action=href?`<a class="go" href="${href}" ${w.link?'':'target="_blank" rel="noopener"'}>${w.link?'Read →':'Open PDF ↗'}</a>`:`<span class="draft-badge">no file yet</span>`;
    return `<article class="item ${w.type} ${w.draft?'draft':''}" style="animation-delay:${i*60}ms">
      <span class="type">${LABEL[w.type]}</span>
      <h3>${w.title}</h3>
      ${w.venue?`<p class="venue">${w.venue}</p>`:''}
      <p>${w.desc}</p>
      <div class="foot"><span>${w.date||''}</span>${action}</div>
    </article>`;
  }).join('');
  emptyEl.classList.toggle('show',list.length===0);
}
const qType=new URLSearchParams(location.search).get('type');
render(TYPES.some(t=>t[0]===qType)?qType:'all');
</script>
</body>
</html>
